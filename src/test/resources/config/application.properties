# Aplicado por cima do application.properties principal em toda execucao de teste.
# Fica em classpath:/config/ para valer sem perfil nem anotacao: um teste novo nao
# tem como esquecer de ativa-lo e cair no banco de desenvolvimento.
#
# A URL e literal de proposito: DB_URL nao deve redirecionar os testes.
# Usuario e senha continuam vindo do application.properties principal.
spring.datasource.url=jdbc:postgresql://localhost:5432/frotamais_test_flyway
app.convites.url-ativacao=https://app.frotamais.teste/ativar
