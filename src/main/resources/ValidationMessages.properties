# Mensagens de validacao (Bean Validation) em portugues do Brasil.
#
# Este e o bundle BASE (sem sufixo de idioma): o Hibernate Validator consulta o
# bundle do usuario antes do seu proprio, e o base vale para qualquer locale da
# JVM ou Accept-Language. Assim a API responde em portugues em qualquer maquina.
#
# A API monta cada detalhe como "campo: mensagem" (ApiExceptionHandler); por isso
# as mensagens comecam em minuscula e nao repetem o nome do campo.
# Arquivo em UTF-8 (lido assim pelo Java 9+). Parametros entre chaves vem da
# anotacao; ${...} e uma expressao avaliada com eles.

jakarta.validation.constraints.NotNull.message=é obrigatório
jakarta.validation.constraints.NotBlank.message=não pode ficar em branco
jakarta.validation.constraints.NotEmpty.message=não pode ficar vazio
jakarta.validation.constraints.Null.message=não deve ser informado
jakarta.validation.constraints.Email.message=deve ser um endereço de e-mail válido
jakarta.validation.constraints.Pattern.message=está em formato inválido

jakarta.validation.constraints.Size.message=${min == 0 ? 'deve ter no máximo ' += max += ' caracteres' : (max == 2147483647 ? 'deve ter pelo menos ' += min += ' caracteres' : 'deve ter entre ' += min += ' e ' += max += ' caracteres')}
frotamais.validacao.lista.tamanho=${min == 0 ? 'deve ter no máximo ' += max += ' itens' : 'deve ter entre ' += min += ' e ' += max += ' itens'}

jakarta.validation.constraints.Min.message=deve ser maior ou igual a {value}
jakarta.validation.constraints.Max.message=deve ser menor ou igual a {value}
jakarta.validation.constraints.DecimalMin.message=deve ser maior ${inclusive == true ? 'ou igual a ' : 'que '}{value}
jakarta.validation.constraints.DecimalMax.message=deve ser menor ${inclusive == true ? 'ou igual a ' : 'que '}{value}
jakarta.validation.constraints.Positive.message=deve ser maior que zero
jakarta.validation.constraints.PositiveOrZero.message=deve ser maior ou igual a zero
jakarta.validation.constraints.Negative.message=deve ser menor que zero
jakarta.validation.constraints.NegativeOrZero.message=deve ser menor ou igual a zero
jakarta.validation.constraints.Digits.message=deve ter no máximo {integer} dígitos na parte inteira e {fraction} casas decimais

jakarta.validation.constraints.Past.message=deve ser uma data passada
jakarta.validation.constraints.PastOrPresent.message=não pode ser uma data futura
jakarta.validation.constraints.Future.message=deve ser uma data futura
jakarta.validation.constraints.FutureOrPresent.message=não pode ser uma data passada
jakarta.validation.constraints.AssertTrue.message=deve ser verdadeiro
jakarta.validation.constraints.AssertFalse.message=deve ser falso
