# Perfil dev: desenvolvimento local (Codespaces). Ativado por
# run-dev-frotamais.sh (SPRING_PROFILES_ACTIVE=dev). Nunca use em producao.
# As variaveis de ambiente continuam tendo prioridade sobre estes valores.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frotamais}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Captura local de e-mails (so no perfil dev; desligada por padrao). Com
# EMAIL_CAPTURA_LOCAL=true, nenhum e-mail e enviado: cada mensagem (ex.: convite
# de motorista) vira um arquivo no diretorio abaixo, que precisa ficar dentro de
# contexto-local/ (privado e ignorado pelo Git). So aceita destinatarios
# ficticios (.test, example.com...). Nao use junto com SMTP.
# Ver docs/AMBIENTE_INTEGRACAO_FRONTEND.md.
app.email.captura-local.ativa=${EMAIL_CAPTURA_LOCAL:false}
app.email.captura-local.diretorio=${EMAIL_CAPTURA_DIR:contexto-local/emails-dev}
