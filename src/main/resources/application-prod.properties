# Perfil de producao. Ative explicitamente com SPRING_PROFILES_ACTIVE=prod.
# Nenhum segredo aqui: tudo que e sensivel vem de variaveis de ambiente
# (lista em .env.example e docs/DEPLOYMENT_PRODUCTION.md).
#
# Ao subir, GuardaProducao confere: perfil dev desligado, CORS_ORIGENS_PERMITIDAS
# com origens https e o banco: a DB_URL tem de apontar exatamente para o banco
# autorizado em DB_NOME_PRODUCAO, que nunca pode ser de desenvolvimento, teste,
# integracao ou ensaio, e o PostgreSQL tem de confirmar esse banco antes do
# Flyway. Sem isso a aplicacao nao sobe. DB_URL, DB_USER, DB_PASSWORD e
# JWT_SECRET continuam obrigatorios (application.properties).

# Banco de producao autorizado. Sem valor (ainda nao ha banco de producao
# contratado), o perfil prod nao sobe.
app.producao.banco-autorizado=${DB_NOME_PRODUCAO:}

# Porta: a hospedagem costuma informar PORT; sem ela, 8080.
server.port=${PORT:8080}
spring.jpa.show-sql=false
# Erros: so o corpo padrao da API; nada de stack trace ou excecao.
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
# O Flyway aplica as migrations pendentes ao subir; nunca limpa o banco nem
# adota um banco existente sozinho (baseline e decisao manual, docs/MIGRATIONS.md).
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
# Encerramento gracioso: termina as requisicoes em andamento ao reiniciar.
server.shutdown=graceful
# IP real do cliente atras do proxy HTTPS da hospedagem (usado pelo limite de
# tentativas). "native": o Tomcat so aceita X-Forwarded-For vindo de proxies
# confiaveis (por padrao, redes privadas: 10/8, 172.16/12, 192.168/16,
# 127/8...) e pega o primeiro IP nao confiavel da direita para a esquerda; o
# que o cliente escreve no cabecalho nao substitui o IP real. Se o proxy da
# hospedagem nao estiver em rede privada, informe a faixa dele em
# SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (regex). Sem proxy: "none".
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
