spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frotamais}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# O schema e versionado pelo Flyway (src/main/resources/db/migration). O Hibernate
# so confere se as entidades batem com ele e nunca altera o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
app.jwt.secret=${JWT_SECRET}
app.jwt.horas=${JWT_HORAS:8}
# Limites de plausibilidade das viagens: barreiras contra erros grosseiros de
# digitacao, nao referencias de mercado. Ajustaveis; minimo < maximo.
app.viagens.limites.preco-diesel-minimo=1.00
app.viagens.limites.preco-diesel-maximo=30.00
app.viagens.limites.consumo-minimo=0.50
app.viagens.limites.consumo-maximo=10.00
# Convites de motorista por e-mail. A validade padrao (24 h) e a sugestao
# inicial do produto, pendente de confirmacao. Sem URL de ativacao, nenhum
# convite e enviado.
app.convites.validade-horas=${CONVITE_VALIDADE_HORAS:24}
app.convites.url-ativacao=${CONVITE_URL_ATIVACAO:}
# E-mail: o SMTP e configurado pelas variaveis padrao do Spring
# (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE).
# Sem SMTP e remetente, operacoes que enviam e-mail respondem 503 e nao gravam nada.
app.email.remetente=${EMAIL_REMETENTE:}
