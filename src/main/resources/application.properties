spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frotamais}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# O schema e versionado pelo Flyway (src/main/resources/db/migration). O Hibernate
# so confere se as entidades batem com ele e nunca altera o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
app.jwt.secret=${JWT_SECRET}
app.jwt.horas=${JWT_HORAS:8}
# Limites de plausibilidade das viagens: barreiras contra erros grosseiros de
# digitacao, nao referencias de mercado. Ajustaveis; minimo < maximo.
app.viagens.limites.preco-diesel-minimo=1.00
app.viagens.limites.preco-diesel-maximo=30.00
app.viagens.limites.consumo-minimo=0.50
app.viagens.limites.consumo-maximo=10.00
