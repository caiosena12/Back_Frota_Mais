spring.application.name=backend
# Configuracao base, valida para producao: nenhuma credencial tem valor padrao.
# Sem DB_URL, DB_USER, DB_PASSWORD e JWT_SECRET definidos, a aplicacao nao sobe.
# Valores de desenvolvimento local ficam em application-dev.properties (perfil
# dev, ativado pelo run-dev-frotamais.sh); os de teste, em src/test/resources.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Sem sessao JPA aberta durante a serializacao: as respostas sao DTOs montados
# dentro das transacoes dos servicos.
spring.jpa.open-in-view=false
# O schema e versionado pelo Flyway (src/main/resources/db/migration). O Hibernate
# so confere se as entidades batem com ele e nunca altera o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
app.jwt.secret=${JWT_SECRET}
app.jwt.horas=${JWT_HORAS:8}
# Limites de plausibilidade das viagens: barreiras contra erros grosseiros de
# digitacao, nao referencias de mercado. Ajustaveis; minimo < maximo.
app.viagens.limites.preco-diesel-minimo=1.00
app.viagens.limites.preco-diesel-maximo=30.00
app.viagens.limites.consumo-minimo=0.50
app.viagens.limites.consumo-maximo=10.00
# Convites de motorista por e-mail. Validade padrao: 24 h (regra do produto).
# Sem URL de ativacao, nenhum convite e enviado.
app.convites.validade-horas=${CONVITE_VALIDADE_HORAS:24}
app.convites.url-ativacao=${CONVITE_URL_ATIVACAO:}
# E-mail: o SMTP e configurado pelas variaveis padrao do Spring
# (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE).
# Sem SMTP e remetente, operacoes que enviam e-mail respondem 503 e nao gravam nada.
app.email.remetente=${EMAIL_REMETENTE:}
# CORS: origens exatas do front-end que podem chamar a API pelo navegador,
# separadas por virgula (ex.: https://app.exemplo.com). Vazio = nenhuma origem
# externa (desenvolvimento com o proxy do Angular). Nunca "*". No perfil prod e
# obrigatorio e so aceita https (ver seguranca/ConfigCors e GuardaProducao).
app.cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:}
# Health check (Actuator): so /actuator/health e publico e responde apenas
# {"status":"UP"} ou {"status":"DOWN"}; nenhum outro endpoint do Actuator e
# exposto. O status inclui o banco; o SMTP fica fora para que uma falha de
# e-mail nao derrube a API na hospedagem.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
# SMTP: timeouts em milissegundos. Sem eles o JavaMail espera para sempre, e
# como o convite e enviado dentro da transacao, um SMTP travado prenderia uma
# conexao do banco. Estourou: 503 e nada e gravado.
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_TIMEOUT_MS:10000}
# Limite de tentativas nos POST publicos (seguranca/LimitesTentativas): por IP
# em login, registro e ativacao de convite; por e-mail nas falhas de login.
# Acima do limite: 429 com Retry-After ate a janela acabar (nunca permanente).
app.tentativas.ativo=true
app.tentativas.max-chaves=20000
app.tentativas.login-ip.limite=30
app.tentativas.login-ip.janela-minutos=5
app.tentativas.login-conta.limite=10
app.tentativas.login-conta.janela-minutos=15
app.tentativas.registro-ip.limite=10
app.tentativas.registro-ip.janela-minutos=60
app.tentativas.ativacao-ip.limite=20
app.tentativas.ativacao-ip.janela-minutos=15
